<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalBot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Cpath d='M10 9h8l4 4v10a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M12 17h8M12 20.5h5' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <a class="brand" href="#/chat">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">LocalBot</span>
        </a>
        <button class="icon-btn only-mobile" id="sidebar-close" aria-label="Close menu"></button>
      </div>
      <button class="btn btn-new-chat" id="new-chat"></button>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="sidebar-section-title" id="history-title">Chats</div>
      <div class="history" id="history" aria-label="Conversations"></div>
      <div class="sidebar-footer" id="sidebar-footer"></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main" id="main"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
